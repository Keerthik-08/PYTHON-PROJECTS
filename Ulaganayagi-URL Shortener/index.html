<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 2rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    p.sub {
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      color: #444;
      margin-bottom: 5px;
      margin-top: 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    input:focus { border-color: #4f46e5; }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #4f46e5;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #3730a3; }

    .msg {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: none;
    }

    .msg.success {
      display: block;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
    }

    .msg.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .short-link { font-weight: bold; }
    .short-link a { color: #4f46e5; }

    .copy-btn {
      width: auto;
      margin-top: 6px;
      padding: 5px 14px;
      font-size: 0.8rem;
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 6px;
    }
    .copy-btn:hover { background: #c7d2fe; }

    h2 {
      margin-top: 36px;
      margin-bottom: 12px;
      font-size: 1rem;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .list { width: 100%; max-width: 520px; }

    .item {
      background: white;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item .code { font-weight: bold; color: #4f46e5; font-size: 0.95rem; }
    .item .original { font-size: 0.8rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .clicks { font-size: 0.78rem; color: #aaa; }

    .empty { color: #aaa; font-size: 0.9rem; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>

  <h1>🔗 URL Shortener</h1>
  <p class="sub">Paste a long URL and get a short link instantly</p>

  <div class="card">
    <label>Long URL</label>
    <input id="longUrl" type="url" placeholder="https://example.com/very/long/url" />

    <label>Custom Alias <span style="font-weight:normal;color:#aaa">(optional)</span></label>
    <input id="alias" type="text" placeholder="e.g. my-link" maxlength="30" />

    <button onclick="shorten()">Shorten URL</button>

    <div id="msg" class="msg"></div>
  </div>

  <h2>Recent Links</h2>
  <div class="list" id="list"></div>

<script>
  async function shorten() {
    const longUrl = document.getElementById("longUrl").value.trim();
    const alias   = document.getElementById("alias").value.trim();
    const msg     = document.getElementById("msg");

    if (!longUrl) { showMsg("Please enter a URL.", "error"); return; }

    const res  = await fetch("/shorten", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ longUrl, alias })
    });
    const data = await res.json();

    if (!res.ok) { showMsg(data.error, "error"); return; }

    showMsg(`
      <div class="short-link">✅ Short link: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a></div>
      <button class="copy-btn" onclick="copy('${data.shortUrl}')">Copy Link</button>
    `, "success");

    document.getElementById("longUrl").value = "";
    document.getElementById("alias").value = "";
    loadList();
  }

  function showMsg(html, type) {
    const el = document.getElementById("msg");
    el.className = "msg " + type;
    el.innerHTML = html;
  }

  function copy(url) {
    navigator.clipboard.writeText(url).then(() => alert("Copied!"));
  }

  async function loadList() {
    const res  = await fetch("/urls");
    const urls = await res.json();
    const el   = document.getElementById("list");

    if (!urls.length) {
      el.innerHTML = `<p class="empty">No links yet. Shorten your first URL above!</p>`;
      return;
    }

    el.innerHTML = urls.map(u => `
      <div class="item">
        <span class="code"><a href="http://localhost:3000/${u.code}" target="_blank">localhost:3000/${u.code}</a></span>
        <span class="original">→ ${u.longUrl}</span>
        <span class="clicks">${u.clicks} click${u.clicks !== 1 ? "s" : ""}</span>
      </div>
    `).join("");
  }

  document.addEventListener("keydown", e => { if (e.key === "Enter") shorten(); });
  loadList();
</script>
</body>
</html>
